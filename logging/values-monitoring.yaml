# values-monitoring.yaml
# Helm chart values
# Maintained by: Platform Engineering

# values-monitoring.yaml — Helm chart values

USER-SUPPLIED VALUES:
loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  rulerConfig:
    storage:
      local:
        directory: /var/loki/rules
      type: local
  schema_config:
    configs:
    - from: "2022-01-11"
      index:
        period: 24h
        prefix: loki_index_
      object_store: s3
      schema: v12
      store: boltdb-shipper
  storage:
    bucketNames:
      chunks: monitoring-grafana-loki
    type: s3
  storage_config:
    aws:
      insecure: false
      s3: s3://eu-west-1/monitoring-grafana-loki
      s3forcepathstyle: true
    boltdb_shipper:
      active_index_directory: /var/loki/index
      shared_store: s3
monitoring:
  alerts:
    enabled: false
  dashboards:
    enabled: false
  rules:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
    lokiCanary:
      enabled: false
  serviceMonitor:
    enabled: false
read:
  replicas: 1
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::444444444444:role/monitoring-grafana-loki-role
  create: true
test:
  enabled: false
write:
  replicas: 2